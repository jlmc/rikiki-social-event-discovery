name: Publish web/ to GitHub Pages

# GitHub Pages only serves static files — it can't run a server. The
# browser can't scrape the real sources directly either (none of them
# send CORS headers — see mobile-app/README.md). So the actual scraping
# happens here, in this workflow's runner (a server, just not one we
# operate ourselves), on a schedule; the result (events.json) is
# published as a static file alongside web/'s HTML/CSS/JS. The browser
# only ever fetches that same-origin file — no live third-party requests,
# no CORS problem.

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: >-
          Force the "source failed" email alert to fire, to test delivery
          on demand — never touches real provider data or the deployed
          events.json, just makes this one run's email step believe a
          source failed.
        required: false
        default: false
        type: boolean
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'cli/collect-events.js'
      - 'cli/providers/**'
      - '.github/workflows/publish-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Step-level `if:` conditions can't reference the `secrets` context
    # directly (GitHub rejects the workflow at dispatch time with
    # "Unrecognized named-value: 'secrets'") — mapping them to job-level
    # env vars first works around that, since `env` *is* available in `if:`.
    env:
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Collect real events (reuses cli/'s tested scraping pipeline)
        working-directory: cli
        run: |
          npm ci
          node collect-events.js

      # SIMULATE lets the email step be tested on demand (from the Actions
      # tab or `trigger.sh SIMULATE_FAILURE=true`) without depending on any
      # real provider actually being down — it only affects this run's
      # check-failures outputs, never cli/events.json or the deployed
      # site's data/warning banner.
      - name: Check for source failures
        id: check-failures
        working-directory: cli
        env:
          SIMULATE: ${{ github.event.inputs.simulate_failure }}
        run: |
          FAILED_COUNT=$(jq '[.sources[] | select(.ok == false)] | length' events.json)
          if [ "$SIMULATE" = "true" ]; then
            FAILED_COUNT=$((FAILED_COUNT + 1))
          fi
          echo "count=$FAILED_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$FAILED_COUNT" -gt 0 ]; then
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
            {
              echo 'summary<<EOF'
              jq -r '.sources[] | select(.ok == false) | "- " + .name + ": " + .error' events.json
              if [ "$SIMULATE" = "true" ]; then
                echo "- simulated-failure (teste manual): disparado propositadamente via workflow_dispatch para testar o envio do email — não é um problema real."
              fi
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
          fi

      # A failed source doesn't stop the pipeline (the site still deploys
      # with a visible in-UI warning — see web/app.js), so nobody would
      # otherwise notice a broken source between scheduled runs. This is
      # deliberately loud (alarmist subject/body, requested explicitly) and
      # fires on every failing run, with no debounce/state between runs.
      #
      # Guarded on all three secrets being set (not just has_failures) so
      # this step is a silent no-op — not a failure — in a fork or before
      # scripts/configure-email-alerts.sh has been run once. The
      # destination address is itself a secret (ALERT_EMAIL), never
      # hardcoded here, so it isn't exposed in this public repo's history.
      - name: Send alarming email if a source failed
        if: >-
          steps.check-failures.outputs.has_failures == 'true' &&
          env.SMTP_USERNAME != '' &&
          env.SMTP_PASSWORD != '' &&
          env.ALERT_EMAIL != ''
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          from: Rikiki Alertas <${{ env.SMTP_USERNAME }}>
          to: ${{ env.ALERT_EMAIL }}
          subject: "🚨🚨🚨 ALERTA: ${{ steps.check-failures.outputs.count }} fonte(s) de eventos FALHARAM no Rikiki! 🚨🚨🚨"
          body: |
            🚨🚨🚨 ATENÇÃO! 🚨🚨🚨

            A recolha automática de eventos do Rikiki teve ${{ steps.check-failures.outputs.count }} fonte(s) a falhar agora mesmo:

            ${{ steps.check-failures.outputs.summary }}

            Os dados publicados em https://jlmc.github.io/rikiki-social-event-discovery/ podem estar incompletos até isto ser corrigido!

            Vê os detalhes completos aqui:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            🚨🚨🚨 AÇÃO NECESSÁRIA 🚨🚨🚨

      - name: Assemble the static site
        run: |
          cp cli/events.json web/events.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
