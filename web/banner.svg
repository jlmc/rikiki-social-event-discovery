<svg viewBox="0 0 960 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rikiki-banner-title">
  <title id="rikiki-banner-title">rikiki — eventos culturais e infantis em Coimbra</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b6cb0" />
      <stop offset="55%" stop-color="#3d5ea8" />
      <stop offset="100%" stop-color="#8a4fb0" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffe9c7" stop-opacity="0.95" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="960" height="220" rx="24" fill="url(#bg)" />
  <circle cx="820" cy="40" r="140" fill="url(#glow)" />
  <circle cx="60" cy="200" r="120" fill="url(#glow)" />

  <!-- decorative icon cluster: event ticket + location pin + music note -->
  <g transform="translate(60, 46)">
    <g transform="rotate(-8)">
      <rect x="0" y="0" width="128" height="88" rx="14" fill="url(#cardGrad)" />
      <circle cx="0" cy="44" r="9" fill="#2b6cb0" />
      <circle cx="128" cy="44" r="9" fill="#2b6cb0" />
      <line x1="86" y1="10" x2="86" y2="78" stroke="#d99a3d" stroke-width="3" stroke-dasharray="6 6" />
      <rect x="16" y="18" width="52" height="8" rx="4" fill="#2b6cb0" opacity="0.75" />
      <rect x="16" y="34" width="38" height="8" rx="4" fill="#2b6cb0" opacity="0.45" />
      <rect x="16" y="54" width="30" height="18" rx="6" fill="#d9534f" opacity="0.85" />
    </g>

    <g transform="translate(96, -18) rotate(6)">
      <path d="M22 0c12 0 22 10 22 22 0 16-22 34-22 34S0 38 0 22C0 10 10 0 22 0z" fill="#ffb703" />
      <circle cx="22" cy="21" r="8" fill="#8a4fb0" />
    </g>

    <g transform="translate(2, 92)">
      <path d="M0 26 V6c0-2 1-3 3-3l18-4c2 0 3 1 3 3v20" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" />
      <circle cx="3" cy="30" r="7" fill="#fff" />
      <circle cx="21" cy="22" r="7" fill="#fff" />
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(260, 0)">
    <text x="0" y="118" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="76" font-weight="800" fill="#ffffff" letter-spacing="1">rikiki</text>
    <text x="4" y="156" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="24" font-weight="600" fill="#ffe9c7">eventos culturais &amp; infantis</text>
    <text x="4" y="184" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="20" font-weight="500" fill="#ffffff" opacity="0.85">Coimbra e região</text>
  </g>
</svg>
